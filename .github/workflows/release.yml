# 推送 v* 标签时测试、编译并发布该版本；推送到 main 只执行测试，不会发布。
# 版本号即标签名，例如 v0.1.23，可用 make release 打下一个补丁版本。
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的已有标签，例如 v0.1.23"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml

  release:
    needs: test
    runs-on: macos-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: 检查标签
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "标签格式应为 vX.Y.Z：$TAG"; exit 1; }
          # 只从 main 发布，避免分支上的临时提交成为正式版本
          git merge-base --is-ancestor "$TAG" origin/main || { echo "$TAG 不在 main 上"; exit 1; }
      - name: 生成更新日志
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          # 上一个版本取当前标签之前最近的标签
          previous=$(git describe --tags --abbrev=0 --match 'v*' "$TAG^" 2>/dev/null || true)
          bash scripts/release-notes.sh "$TAG" "$previous" "$GITHUB_REPOSITORY" > "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md"
      - name: 编译
        run: |
          mkdir -p dist
          ldflags="-s -w -X github.com/KevinXC5/sysbox/internal/meta.Version=$TAG"
          for os in darwin windows; do
            for arch in arm64 amd64; do
              out="dist/sysbox-${os}-${arch}"
              if [ "$os" = windows ]; then out="${out}.exe"; fi
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
                -ldflags "$ldflags" \
                -o "$out" ./cmd/sysbox
            done
          done
          (cd dist && shasum -a 256 sysbox-* > checksums.txt)
          cat dist/checksums.txt
      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/* \
            --verify-tag \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --latest
