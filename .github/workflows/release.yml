# 推送到 main 时自动测试、编译并发布新版本；只改文档不会触发发布。
# 版本号 = VERSION 文件中的主次版本号 + 本工作流的运行序号，例如 v0.1.23。
name: release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: "测试通过后发布新版本"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: 检查格式
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: 静态检查
        run: go vet ./...
      - name: 测试
        run: go test -race ./...

  release:
    needs: test
    # 跳过发布时仍执行测试；手动运行可独立选择是否发布。
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push' && vars.AUTO_RELEASE != 'false' &&
      !contains(github.event.head_commit.message, '[skip release]')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish))
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: 计算版本号
        id: version
        run: echo "tag=v$(tr -d '[:space:]' < VERSION).${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - name: 生成更新日志
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous=$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // empty')
          bash scripts/release-notes.sh "$GITHUB_SHA" "$previous" "$GITHUB_REPOSITORY" > "$RUNNER_TEMP/release-notes.md"
      - name: 编译
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          mkdir -p dist
          for arch in arm64 amd64; do
            CGO_ENABLED=0 GOOS=darwin GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X github.com/KevinXC5/sysbox/internal/meta.Version=$TAG" \
              -o "dist/sysbox-darwin-$arch" ./cmd/sysbox
          done
          (cd dist && shasum -a 256 sysbox-darwin-* > checksums.txt)
          cat dist/checksums.txt
      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" dist/* \
            --title "$TAG" \
            --target "$GITHUB_SHA" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --latest
