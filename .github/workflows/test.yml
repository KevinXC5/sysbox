# 推送到 main、提交 PR 时执行测试；发布工作流也会先调用这里。
name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact ref to test
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: 检查格式
        if: runner.os == 'macOS'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: 静态检查
        run: go vet ./...
      - name: 测试（含数据竞争检测）
        run: go test -race ./...
      - name: 四平台编译
        if: runner.os == 'macOS'
        shell: bash
        run: |
          for os in darwin windows; do
            for arch in amd64 arm64; do
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -o "$RUNNER_TEMP/sysbox-$os-$arch" ./cmd/sysbox
            done
          done
